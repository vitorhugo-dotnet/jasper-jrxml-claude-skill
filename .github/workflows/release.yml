name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate version tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -q "^[[:space:]]*version: \"${version}\"$" SKILL.md
          python3 - "$version" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = sys.argv[1]
          manifests = (
              Path('.claude-plugin/plugin.json'),
              Path('packaging/codex/plugin.json'),
          )
          for path in manifests:
              manifest = json.loads(path.read_text(encoding='utf-8'))
              if manifest.get('version') != expected:
                  raise SystemExit(f'{path} version does not match the Git tag')
          PY

      - name: Validate repository
        run: bash tests/validate-skill.sh all

      - name: Validate distribution packages
        run: bash tests/package-skill.Tests.sh

      - name: Build release assets
        run: bash scripts/package-skill.sh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/legacy-jrxml-toolkit-agent-skill.zip \
            dist/legacy-jrxml-toolkit-agent-skill.zip.sha256 \
            dist/legacy-jrxml-toolkit-chatgpt-codex-plugin.zip \
            dist/legacy-jrxml-toolkit-chatgpt-codex-plugin.zip.sha256 \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
