name: Apply OpenAI interface fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-openai-interface-fix.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/openai-interface-assets' || github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: fix/openai-interface-assets
          fetch-depth: 0

      - name: Apply and regenerate plugin package
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-openai-interface-fix.py
          python3 scripts/sync-codex-plugin.py

      - name: Commit migration branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add OpenAI plugin interface assets"
          git push origin HEAD:fix/openai-interface-assets

      - name: Remove one-time workflow from main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main:main
          git checkout main
          git rm .github/workflows/apply-openai-interface-fix.yml
          git commit -m "chore: remove one-time OpenAI migration workflow"
          git push origin main
