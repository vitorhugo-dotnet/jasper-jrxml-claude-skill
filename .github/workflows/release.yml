name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -q "^[[:space:]]*version: \"${version}\"$" SKILL.md

      - name: Validate repository
        run: bash tests/validate-skill.sh

      - name: Validate Codex/OpenAI skill package
        run: bash tests/package-skill.Tests.sh

      - name: Build release assets
        run: bash scripts/package-skill.sh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/jasper-jrxml-skill.zip \
            dist/jasper-jrxml-skill.zip.sha256 \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
